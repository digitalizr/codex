name: Validate Hearth
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  windows-launcher:
    name: Windows PowerShell launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native Windows PowerShell 5.1 execution
        shell: powershell
        run: .\tests\windows-launcher-smoke.ps1
